# =====================================================================
# Perfil de PRODUCAO. Ativado com a variavel de ambiente SPRING_PROFILES_ACTIVE=prod.
# Este arquivo SOBRESCREVE o application.properties apenas nas chaves abaixo; o resto vale igual.
#
# Regra: em producao nada pode cair num padrao de desenvolvimento (localhost, Mailpit...).
# Por isso as variaveis abaixo nao tem valor padrao. Se faltar alguma, a API falha ao subir
# (banco, CORS, e-mail, JWT), em vez de funcionar "pela metade" apontando para o lugar errado.
# =====================================================================

# --- Servidor ---
# A hospedagem (Render) informa a porta pela variavel PORT
server.port=${PORT:8080}
# A API fica atras do proxy HTTPS da hospedagem, que repassa a requisicao em HTTP.
# Sem isto, a API acha que foi chamada em http:// e monta links errados (ex.: o cabecalho Location do 201).
# "framework" = o Spring le os cabecalhos X-Forwarded-Proto/Host enviados pelo proxy.
server.forward-headers-strategy=framework

# --- Banco de dados ---
# URL completa obrigatoria. Provedores gerenciados exigem TLS: inclua ?sslmode=require
# (ex.: jdbc:postgresql://<host>/portfolio?sslmode=require)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Nao imprimir SQL no log de producao (ruido e possivel exposicao de dados)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- E-mail pela API HTTP do Resend ---
# O Render free bloqueia as portas SMTP, entao em producao o e-mail sai por HTTPS (ResendEmailService).
# Sem dominio proprio, o Resend so entrega para o e-mail dono da conta: ADMIN_EMAIL tem que ser esse e-mail.
app.email.provedor=resend
# Chave criada no painel do Resend (comeca com "re_"); sem ela a API nao sobe
app.email.resend.api-key=${RESEND_API_KEY}
# Remetente obrigatorio. Sem dominio proprio: onboarding@resend.dev
app.email.remetente=${MAIL_FROM}

# --- CORS ---
# Somente o dominio real do front (nada de localhost em producao)
app.cors.origens-permitidas=${CORS_ORIGINS}

# --- Swagger desligado ---
# O mapa completo da API (inclusive rotas do painel) nao fica publico em producao
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
