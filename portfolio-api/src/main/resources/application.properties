spring.application.name=portfolio-api

# Le o arquivo .env (formato CHAVE=valor) como propriedades, se existir.
# Assim a mesma senha do docker-compose chega na aplicacao sem duplicar.
# Em producao (Render) o arquivo nao existe e as variaveis de ambiente reais sao usadas.
spring.config.import=optional:file:.env[.properties]

# --- Banco de dados (PostgreSQL) ---
# Valores vem de variaveis de ambiente; o que esta depois do ":" e o padrao para desenvolvimento local
# (o Postgres do docker-compose, na porta 5433). O driver e descoberto pela URL (jdbc:postgresql:...).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# Quem cria e altera as tabelas e o Flyway (scripts em src/main/resources/db/migration, aplicados ao subir).
# O Hibernate so CONFERE: se uma entidade nao bater com o banco (coluna/tabela faltando), a API nem sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desliga o "Open Session in View": a conexao com o banco nao fica aberta ate o JSON ser escrito.
# Os services ja devolvem DTOs montados dentro da transacao, entao nao precisamos dele.
spring.jpa.open-in-view=false

# --- E-mail (lido pela classe EmailProperties) ---
# Provedor: smtp (padrao, Mailpit em desenvolvimento) ou resend (API HTTP, usado no perfil prod)
app.email.provedor=smtp
app.email.remetente=${MAIL_FROM:nao-responda@portfolio.local}
# Resend: so usado com app.email.provedor=resend (chave em RESEND_API_KEY)
app.email.resend.url=https://api.resend.com
app.email.resend.api-key=${RESEND_API_KEY:}

# SMTP: padrao = Mailpit do docker-compose (e-mails aparecem em http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# --- Clientes HTTP (RestClient, usado pelo Resend) ---
# Nunca deixar o login preso esperando um servico externo que nao responde
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# --- Autenticacao (lido pela classe AuthProperties) ---
# Conta do painel criada na primeira inicializacao, se a tabela "acessos" estiver vazia
app.auth.admin-email=${ADMIN_EMAIL}
app.auth.admin-senha=${ADMIN_PASSWORD}
# Por quanto tempo o codigo enviado por e-mail vale (formato Duration: 10m, 90s...)
app.auth.codigo-validade=10m
# Erros de codigo permitidos; ao atingir o limite o codigo e invalidado (protege contra "chutar" os 6 digitos)
app.auth.max-tentativas-codigo=5
# Chave secreta (Base64, 32 bytes) que assina os tokens JWT, e por quanto tempo um token vale
app.auth.jwt-secret=${JWT_SECRET}
app.auth.token-validade=2h

# --- CORS (lido pela classe CorsProperties) ---
# Sites que podem chamar a API pelo navegador, separados por virgula. [*] = qualquer porta.
# Padrao: Flutter Web local. Em producao: CORS_ORIGINS=https://<dominio-do-front>
app.cors.origens-permitidas=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# --- Swagger / OpenAPI ---
# UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
